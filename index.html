<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First month with one teacher — the fork</title>
<style>
:root{
  --violet:#6d46fc; --violet-dark:#4221b8; --indigo:#210a74;
  --magnolia:#f7f5ff; --ink:#2c2a33; --muted:#6b6875;
  --line:#e4e2ea; --alarm-bg:#fff3f3; --alarm:#c8102e;
  --warn-bg:#fff8df; --warn:#8a6d00; --ok-bg:#e9fbf0; --ok:#1d7a3a;
  --paper:#fff; --canvas:#f4f4f4;
  --font:"Mikado","Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------- control rail ---------- */
.rail{position:sticky;top:0;z-index:70;background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.rail h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em}
.rail .sub{font-size:13px;color:#b7b4c2;margin-right:auto}
.seg{display:flex;background:#3d3a48;border-radius:8px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:12.5px;font-weight:700;border:0;background:transparent;color:#b7b4c2;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.rail .links{display:flex;gap:12px}
.rail .links a{color:#9694ff;font-size:12.5px;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(150,148,255,.4)}
.rail .links a:hover{color:#fff;border-color:#fff}
.rail label{font-size:12.5px;color:#b7b4c2;display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none}

/* ---------- stage ---------- */
.stage{max-width:1180px;margin:28px auto 80px;padding:0 20px}
.note{background:var(--warn-bg);border-left:4px solid var(--warn);padding:14px 18px;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.55;margin-bottom:24px}
.note b{color:var(--warn)}

.pa{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pa-top{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo span{color:var(--violet)}
.pa-top nav{display:flex;gap:20px;font-size:14px;color:var(--muted)}
.pa-top nav .on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--violet);padding-bottom:13px;margin-bottom:-15px}
.kid{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#c76ef2,#6d46fc)}

.pa-body{padding:24px 22px 30px}
.h2{font-size:19px;font-weight:700;margin:0 0 16px}

/* alert bar */
.alert{display:flex;gap:14px;padding:16px 18px;border-radius:10px;background:var(--warn-bg);margin-bottom:20px;align-items:flex-start}
.alert.urgent{background:var(--alarm-bg)}
.alert .ico{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.alert h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
.alert p{margin:0 0 12px;font-size:14px;line-height:1.5;color:#4a4756}
.alert .acts{display:flex;gap:10px;flex-wrap:wrap}

/* lesson rows */
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row.dim{opacity:.5}
.row .date{font-weight:700;color:var(--muted);font-size:13px;line-height:1.35}
.row .date b{display:block;color:var(--ink);font-size:16px}
.row .who{font-weight:700}
.row .unit{color:var(--muted);font-size:13px;margin-top:2px}
.row.broken{background:var(--warn-bg)}
.row.broken.urgent{background:var(--alarm-bg)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;vertical-align:2px;margin-left:8px}
.tag.wk{background:var(--magnolia);color:var(--violet-dark)}
.tag.bad{background:#ffd9de;color:var(--alarm)}
.tag.kept{background:var(--ok-bg);color:var(--ok)}
.tag.sub{background:#ece9fb;color:var(--violet-dark)}

/* buttons */
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;transition:.12s}
.btn.p{background:var(--violet);color:#fff}
.btn.p:hover{background:var(--violet-dark)}
.btn.s{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.s:hover{box-shadow:inset 0 0 0 1.5px var(--violet);color:var(--violet-dark)}
.btn.q{background:transparent;color:var(--muted);padding:10px 6px}
.btn.q:hover{color:var(--violet-dark)}
.btn.sm{font-size:13px;padding:8px 14px}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;padding-top:76px;background:rgba(20,18,30,.5);display:none;place-items:center;z-index:60;padding:24px 24px 24px}
.scrim.on{display:grid}
.dlg{background:#fff;border-radius:12px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.24);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dlg-h{padding:22px 24px 0}
.dlg-h .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:8px}
.dlg-h .eyebrow.bad{color:var(--alarm)}
.dlg-h h2{margin:0;font-size:20px;line-height:1.3}
.dlg-h p.lede{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:#4a4756}
.dlg-b{padding:20px 24px 24px}
.dlg-f{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;font:inherit;margin-bottom:10px;transition:.12s}
.opt:hover{border-color:var(--violet);background:var(--magnolia)}
.opt .oav{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#9694ff,#6d46fc);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.opt .oav.alt{background:linear-gradient(135deg,#d9d7e6,#b7b4c2)}
.opt b{display:block;font-size:15px;margin-bottom:3px}
.opt span{font-size:13.5px;color:var(--muted);line-height:1.45}
.opt.quiet{border-style:dashed}

details.more{margin-top:4px}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:700;padding:8px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--violet)}
details.more[open] summary::before{content:"▾ "}

.fact{display:flex;gap:12px;align-items:center;background:var(--ok-bg);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.fact .big{font-size:15px;font-weight:800;color:var(--ok)}
.fact small{display:block;color:#3d6b4f;font-weight:600;font-size:12.5px;margin-top:2px}
.fact.warn{background:var(--warn-bg)}
.fact.warn .big{color:var(--warn)}
.fact.warn small{color:#6d5700}

/* slot grid */
.slotwrap{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.slotwrap h4{margin:0 0 3px;font-size:14.5px}
.slotwrap .sub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{font:inherit;font-size:13px;font-weight:700;padding:9px 6px;border-radius:7px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:center;line-height:1.3}
.slot span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.slot:hover{border-color:var(--violet);color:var(--violet-dark)}
.slot[disabled]{opacity:.32;cursor:not-allowed}
.empty{padding:22px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;line-height:1.55}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.window{font-size:12.5px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.window b{color:var(--alarm)}

/* annotation */
.anno{position:relative;margin:0 0 18px;background:#fffbe8;border:1px solid #f0e3a8;border-radius:8px;padding:11px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;color:#6d5700;display:none}
body.anno-on .anno{display:block}
.anno b{color:#8a6d00}

.log{margin-top:26px;background:#1c1a24;color:#c9c6d6;border-radius:10px;padding:16px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
.log h4{margin:0 0 8px;color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.log div{padding:2px 0;border-bottom:1px solid #2c2a37}
.log div:last-child{border:0}
.log .k{color:#9694ff}

@media(max-width:720px){
  .pa-top nav{display:none}
  .row{grid-template-columns:64px 1fr;gap:10px}
  .row .acts{grid-column:1/-1}
  .rail{gap:12px}
  .rail .sub{width:100%;order:9}
}
</style>
</head>
<body>

<div class="rail">
  <h1>First month with one teacher</h1>
  <span class="sub">clickable draft — logic, not pixels</span>
  
  <div class="seg" id="scen">
    <button data-s="normal" aria-pressed="true">1 · Teacher unavailable</button>
    <button data-s="noslots">2 · No slots</button>
    <button data-s="sameday">3 · Same-day</button>
    <button data-s="third">4 · Third time</button>
    <button data-s="subbed">5 · Substitution + auto-return</button>
  </div>
  <label><input type="checkbox" id="wide"> reschedule window: rest of first month</label>
  
</div>

<div class="stage">

  <div class="note" id="scennote"></div>

  <div class="pa">
    <div class="pa-top">
      <div class="logo">NOV<span>A</span>KID</div>
      <nav><a class="on">Schedule</a><a>Main page</a><a>Courses</a><a>Teachers</a></nav>
      <div class="kid"><div class="av"></div> Sam · first month, day 12</div>
    </div>

    <div class="pa-body">
      <div id="alertslot"></div>
      <h2 class="h2">Upcoming lessons</h2>
      <div class="rows" id="rows"></div>
      <div class="log" id="log"><h4>State</h4><div>nothing yet</div></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="dlg" id="dlg"></div></div>

<script>
const $ = s => document.querySelector(s);
const state = { scen:'normal', wide:false, balance:7, done:null, log:[] };

const SCEN = {
  normal:{
    note:'Scenario 1 — the base case. The teacher cancels a lesson four days out. Today the system substitutes silently and posts a notice the parent can do nothing with. Here the parent gets a choice instead — and it opens with a <b>fact</b>, not a question: the lesson is already back.',
    urgent:false, slots:true, repeat:0,
    lede:'Anna cannot teach Sam’s lesson on Thursday 28 August, 19:00.'
  },
  noslots:{
    note:'Scenario 2 — the case that decides the flow. The same teacher has nothing free. This is the common path, not an edge case, because a teacher’s calendar can genuinely be full. Toggle the window switch in the rail to see why the current one-week search horizon is the real blocker.',
    urgent:false, slots:false, repeat:0,
    lede:'Anna cannot teach Sam’s lesson on Thursday 28 August, 19:00.'
  },
  sameday:{
    note:'Scenario 3 — the teacher cancels hours before the lesson. Two rules collide: cancelling is free above a threshold, rescheduling above a shorter one. The screen has to remove the unfairness before it offers a calm choice.',
    urgent:true, slots:true, repeat:0,
    lede:'Anna cannot teach Sam’s lesson today at 19:00 — it starts in 3 hours.'
  },
  third:{
    note:'Scenario 4 — third week running. Patience stops being the right answer: each repeat sharply raises the chance the pair breaks. The tone escalates and the ladder reorders — but the pair is not abandoned: a substitution here covers <b>this lesson only</b>, and the teacher returns automatically.',
    urgent:false, slots:false, repeat:3,
    lede:'Anna has been unable to teach Sam’s lesson three weeks running.'
  },
  subbed:{
    note:'Scenario 5 — the current proposal. Substitution is <b>not removed — it is demoted to the last resort</b>, and it no longer takes the pair with it: after a substituted lesson the student is <b>returned to the original teacher automatically</b>. That single rule is what the test is about, because pairs break when a substitute quietly becomes the new default teacher.',
    urgent:false, slots:false, repeat:0, subbed:true,
    lede:'Maria taught Thursday’s lesson in Anna’s place.'
  }
};

const SLOTS_NEAR = [['Fri 29','17:00'],['Fri 29','18:30'],['Sat 30','11:00']];
const SLOTS_FAR  = [['Wed 3 Sep','17:30'],['Fri 5 Sep','17:30'],['Sat 6 Sep','11:00'],['Tue 9 Sep','19:00']];

function log(k,v){ state.log.unshift({k,v}); render(); }

function alertHTML(){
  const s = SCEN[state.scen];
  if(s.subbed) return `
  <div class="alert" style="background:var(--ok-bg)">
    <div class="ico">↩</div>
    <div style="flex:1">
      <h3>Maria stood in on Thursday — Anna is back from next lesson</h3>
      <p>You didn’t have to do anything. Sam’s weekly time with Anna is unchanged, and Tuesday 2 September is with Anna as usual.</p>
      <div class="acts"><button class="btn s" onclick="log('checked','parent opened the substitution detail')">What happened</button></div>
    </div>
  </div>`;
  if(state.done) return '';
  return `
  <div class="alert ${s.urgent?'urgent':''}">
    <div class="ico">${s.urgent?'⏰':'📅'}</div>
    <div style="flex:1">
      <h3>${s.repeat?'Anna has cancelled three weeks running':'Anna cannot teach this lesson'}</h3>
      <p>${s.lede} ${s.urgent?'Nothing has been charged — this was not your cancellation.':'Your lesson is safe either way.'}</p>
      <div class="acts">
        <button class="btn p" onclick="openFork()">Choose what happens</button>
        <button class="btn q" onclick="log('dismissed','parent postponed the choice')">Later</button>
      </div>
    </div>
  </div>`;
}

function rowsHTML(){
  const s = SCEN[state.scen];
  if(s.subbed) return `
  <div class="row dim"><div class="date">Thu<b>28</b></div><div><div class="who">Maria <span class="tag sub">Stood in for Anna</span></div><div class="unit">Unit 6 · Food · 19:00 · done</div></div><div></div></div>
  <div class="row"><div class="date">Tue<b>2</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span> <span class="tag kept">Back with Anna</span></div><div class="unit">Unit 6 · Food · 19:00</div></div><div></div></div>
  <div class="row"><div class="date">Thu<b>4</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span></div><div class="unit">Unit 7 · Home · 19:00</div></div><div></div></div>`;
  const broken = state.done
    ? (state.done==='moved'
        ? `<div class="row"><div class="date">Fri<b>29</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span> <span class="tag kept">Rescheduled · same teacher</span></div><div class="unit">Unit 6 · Food · 17:00</div></div><div></div></div>`
        : state.done==='subbed'
        ? `<div class="row"><div class="date">Thu<b>28</b></div><div><div class="who">Substitute <span class="tag sub">This lesson only</span> <span class="tag kept">Anna back from 2 Sep</span></div><div class="unit">Unit 6 · Food · 19:00</div></div><div></div></div>`
        : `<div class="row dim"><div class="date">Thu<b>28</b></div><div><div class="who">Anna <span class="tag kept">Cancelled · nothing charged</span></div><div class="unit">Unit 6 · Food · 19:00</div></div><div></div></div>`)
    : `<div class="row broken ${s.urgent?'urgent':''}"><div class="date">${s.urgent?'Today':'Thu'}<b>${s.urgent?'':'28'}</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span> <span class="tag bad">Teacher unavailable</span></div><div class="unit">Unit 6 · Food · 19:00</div></div><div><button class="btn s sm" onclick="openFork()">Choose</button></div></div>`;
  return broken + `
  <div class="row"><div class="date">Tue<b>2</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span></div><div class="unit">Unit 6 · Food · 19:00</div></div><div></div></div>
  <div class="row"><div class="date">Thu<b>4</b></div><div><div class="who">Anna <span class="tag wk">Weekly</span></div><div class="unit">Unit 7 · Home · 19:00</div></div><div></div></div>`;
}

function render(){
  $('#scennote').innerHTML = SCEN[state.scen].note;
  $('#alertslot').innerHTML = alertHTML();
  $('#rows').innerHTML = rowsHTML();
  $('#log').innerHTML = '<h4>State</h4>' + (state.log.length
    ? state.log.map(l=>`<div><span class="k">${l.k}</span> — ${l.v}</div>`).join('')
    : `<div>lessons on balance: ${state.balance} · first month day 12 of 30 · nothing chosen yet</div>`);
}

/* ---------- dialogs ---------- */
function show(html){ $('#dlg').innerHTML = html; $('#scrim').classList.add('on'); }
function close(){ $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click', e => { if(e.target.id==='scrim') close(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });

function openFork(){
  const s = SCEN[state.scen];
  const factClass = s.urgent ? 'fact' : 'fact';
  show(`
  <div class="dlg-h">
    <div class="eyebrow ${s.urgent?'bad':''}">${s.urgent?'Starts in 3 hours':'First month · one teacher'}</div>
    <h2>${s.repeat?'Anna’s schedule isn’t lining up with yours':'Anna can’t teach on '+(s.urgent?'today, 19:00':'Thu 28 Aug, 19:00')}</h2>
    <p class="lede">${s.repeat
      ? 'Three weeks running we haven’t been able to hold Sam’s lesson with Anna. You can keep waiting for her — or add a second teacher and keep both.'
      : 'You’re in Sam’s first month, so we won’t put anyone else in her place without asking you.'}</p>
  </div>
  <div class="dlg-b">
    <div class="${factClass}">
      <div>
        <div class="big">This lesson has already been returned — nothing was charged</div>
        <small>Lessons on balance: ${state.balance} → ${state.balance+1}${s.urgent?' · the under-8-hours rule does not apply, this was not your cancellation':''}</small>
      </div>
    </div>
    

    <button class="opt" onclick="openSlots()">
      <div class="oav">A</div>
      <div><b>Move it to another time with Anna</b><span>${s.slots?'She has 3 free times in the next few days':'She has nothing free this week — we’ll show you the options'}</span></div>
    </button>

    <button class="opt" onclick="openKeep()">
      <div class="oav alt">↩</div>
      <div><b>Leave it — the lesson stays with you</b><span>Your schedule and your subscription period are untouched</span></div>
    </button>

    
    <details class="more" ${s.repeat?'open':''}>
      <summary>${s.repeat?'Neither works? Here is the last resort':'Can’t make either work?'}</summary>
      <button class="opt quiet" onclick="openOther()">
        <div class="oav alt">↷</div>
        <div><b>Let someone else take just this lesson</b><span>Anna stays Sam’s teacher — she’s back for the next one, automatically</span></div>
      </button>
    </details>
  </div>
  <div class="dlg-f"><button class="btn q" onclick="close()">Close</button></div>`);
  log('fork opened', 'scenario: '+state.scen);
}

function openSlots(){
  const s = SCEN[state.scen];
  const wide = state.wide;
  const list = s.slots ? SLOTS_NEAR.concat(wide?SLOTS_FAR:[]) : (wide?SLOTS_FAR:[]);
  const body = list.length
    ? `<div class="days">${list.map(([d,t])=>`<button class="slot" onclick="doMove('${d}','${t}')">${t}<span>${d}</span></button>`).join('')}</div>`
    : `<div class="empty"><b>Anna has nothing free in the next 7 days</b>Her next open time is <b>Fri 5 September, 17:30</b> — outside the current search window.</div>`;
  show(`
  <div class="dlg-h">
    <div class="eyebrow">Same teacher</div>
    <h2>Anna’s free times</h2>
    <p class="lede">Only Anna’s calendar is shown here. Sam keeps the same teacher.</p>
  </div>
  <div class="dlg-b">
    
    <div class="slotwrap">
      <h4>👩‍🏫&nbsp;Anna — Sam’s teacher since the trial</h4>
      <p class="sub">Weekly, Thursdays 19:00 · 11 lessons together</p>
      ${body}
      <div class="window">Search window: <b>${wide?'to the end of the first month (30 Sep)':'the next 7 days'}</b>${wide?'':' — which is why “no slot this week” currently reads as “no slot at all”. Flip the switch in the top rail.'}</div>
    </div>
    ${list.length?'':`
    
    <button class="opt" onclick="doNotify()"><div class="oav">🔔</div><div><b>Tell me when Anna opens a time</b><span>We hold the slot for you — you’re the only one waiting for it</span></div></button>
    <button class="opt" onclick="doAsk()"><div class="oav alt">✉</div><div><b>Ask Anna to open a weekly time</b><span>A structured request, not a chat. She answers within 24 hours</span></div></button>
    <button class="opt" onclick="openKeep()"><div class="oav alt">↩</div><div><b>Just leave the lesson with me</b><span>Nothing is charged, your period is untouched</span></div></button>`}
  </div>
  <div class="dlg-f"><button class="btn q" onclick="openFork()">Back</button></div>`);
  log('branch A', 'reschedule with the same teacher · slots '+(list.length||0));
}

function openOther(){
  show(`
  <div class="dlg-h"><div class="eyebrow">Last resort · this lesson only</div><h2>Someone else takes Thursday — Anna keeps Sam</h2>
  <p class="lede">Only this one lesson changes hands. Sam’s weekly time and Sam’s teacher stay exactly as they are.</p></div>
  <div class="dlg-b">
    <div class="fact"><div><div class="big">Anna is back from the next lesson — automatically</div><small>You don’t have to rebook her. Tue 2 Sep, 19:00 is already with Anna</small></div></div>
    
    <button class="opt" onclick="doSub('Maria')"><div class="oav">M</div><div><b>Maria</b><span>Has taught Sam twice · free Thursday 19:00</span></div></button>
    <button class="opt" onclick="doSub('Kate')"><div class="oav alt">K</div><div><b>Kate</b><span>New to Sam · same level and certification</span></div></button>
  </div>
  <div class="dlg-f"><button class="btn q" onclick="openFork()">Back</button></div>`);
  log('branch C', 'substitution — last resort, this lesson only, auto-return armed');
}

function openKeep(){
  show(`
  <div class="dlg-h"><div class="eyebrow">Nothing lost</div><h2>The lesson stays with you</h2></div>
  <div class="dlg-b">
    <div class="fact"><div><div class="big">Lessons on balance: ${state.balance} → ${state.balance+1}</div><small>Your weekly time stays booked · your period still ends 30 September</small></div></div>
    
    <p style="font-size:14.5px;line-height:1.6;margin:0 0 4px">You can book it with Anna any time before the end of your first month. If you don’t, we extend your period by a week automatically — you don’t have to remember.</p>
  </div>
  <div class="dlg-f"><button class="btn q" onclick="openFork()">Back</button><button class="btn p" onclick="doKeep()">Leave it with me</button></div>`);
}

function doMove(d,t,other){
  state.done='moved'; close();
  log('resolved', `moved to ${d} ${t}${other?' — with a different teacher (deliberate)':' — same teacher'}`);
}
function doKeep(){ state.balance++; state.done='kept'; close(); log('resolved','lesson kept · balance '+(state.balance-1)+' → '+state.balance+' · nothing charged'); }
function doSub(name){ state.done='subbed'; close(); log('resolved', name+' takes this lesson only · Anna restored automatically from the next lesson'); }
function doNotify(){ close(); log('C1 exit 1','slot alert armed for Anna — the slot is held, not raced for'); }
function doAsk(){ close(); log('C1 exit 2','structured request sent to the teacher — answered within 24 hours'); }

/* rail */
document.querySelectorAll('#scen button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#scen button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  state.scen=b.dataset.s; state.done=null; state.log=[]; close(); render();
}));
$('#wide').addEventListener('change',e=>{ state.wide=e.target.checked; render(); if($('#scrim').classList.contains('on')) openSlots(); });


render();
</script>
</body>
</html>
